<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偶然の1冊</title>
<style>
:root {
  --bg: #f6f4ef;
  --card: #ffffff;
  --ink: #1d1b19;
  --sub: #6b665f;
  --line: #ddd8cf;
  --btn: #1f3a5f;
  --btn-ink: #ffffff;
  --amz: #ffa41c;
  --amz-ink: #1d1b19;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --card: #211f1d; --ink: #efebe4; --sub: #a29c92;
    --line: #38342f; --btn: #8fb0dc; --btn-ink: #10161f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  line-height: 1.7;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
main { max-width: 520px; margin: 0 auto; padding: 32px 0 40px; }
h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 1.9rem; letter-spacing: .08em; margin: 0 0 4px;
}
.lead { color: var(--sub); margin: 0 0 24px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
button {
  font: inherit; cursor: pointer; border: 0; border-radius: 6px;
  padding: 10px 28px; background: var(--btn); color: var(--btn-ink); font-weight: 700;
}
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #4d8fe6; outline-offset: 2px; }
#result { min-height: 40px; }
.book {
  display: grid; grid-template-columns: 112px 1fr; gap: 20px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px;
}
.cover {
  width: 112px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 2px 4px 4px 2px;
  box-shadow: -3px 0 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18); background: var(--line);
}
.nocover {
  width: 112px; aspect-ratio: 2 / 3; display: grid; place-items: center; text-align: center;
  padding: 8px; font-size: .75rem; color: var(--sub); background: var(--line);
  border-radius: 2px 4px 4px 2px;
}
.title { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: 1.15rem; font-weight: 700; line-height: 1.5; margin: 0 0 8px; }
.meta { color: var(--sub); font-size: .88rem; margin: 0; }
.amz {
  display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 6px;
  background: var(--amz); color: var(--amz-ink); text-decoration: none; font-weight: 700; font-size: .95rem;
}
.amz:hover { filter: brightness(.95); }
.msg { color: var(--sub); }
.note { margin-top: 28px; font-size: .78rem; color: var(--sub); }
@media (max-width: 420px) {
  .book { grid-template-columns: 1fr; justify-items: start; }
}
@media (prefers-reduced-motion: no-preference) {
  .book { animation: draw .25s ease-out; }
  @keyframes draw { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<main>
  <h1>偶然の1冊</h1>
  <p class="lead">実在する本の中から、ランダムに1冊を選びます。</p>

  <div class="controls">
    <button id="draw" type="button">本をひく</button>
    <label><input type="checkbox" id="recent"> 最近3年の本だけ</label>
  </div>

  <div id="result" aria-live="polite"></div>

  <p class="note">このページには広告(Amazonアソシエイトのアフィリエイトリンク)が含まれます。Amazonのアソシエイトとして、「偶然の1冊」は適格販売により収入を得ています。</p>
</main>

<script>
// ▼ ここを自分のトラッキングID(例: abcde-22)に書き換える
const TRACKING_ID = "sozoro00-22";

const BATCH_SIZE = 1000;   // 1回の問い合わせで確認するISBNの数
const MAX_BATCHES = 12;    // 見つからない場合の最大試行回数

const $draw = document.getElementById("draw");
const $recent = document.getElementById("recent");
const $result = document.getElementById("result");

// ISBN-13 のチェックディジット
function check13(d12) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += Number(d12[i]) * (i % 2 ? 3 : 1);
  return String((10 - (s % 10)) % 10);
}

// 日本の書籍(978-4)のISBN-13候補をランダムに作る
function randomIsbn13() {
  let body = "9784";
  for (let i = 0; i < 8; i++) body += Math.floor(Math.random() * 10);
  return body + check13(body);
}

// ISBN-13 → ISBN-10(紙の書籍ではAmazonのASINと同じ)
function isbn13to10(isbn13) {
  const b = isbn13.slice(3, 12);
  let s = 0;
  for (let i = 0; i < 9; i++) s += Number(b[i]) * (10 - i);
  const c = (11 - (s % 11)) % 11;
  return b + (c === 10 ? "X" : String(c));
}

// openBD に一括で問い合わせ、実在する本だけ返す
async function lookup(isbns) {
  const res = await fetch("https://api.openbd.jp/v1/get", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "isbn=" + isbns.join(",")
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return data.filter(function (x) { return x && x.summary && x.summary.title; });
}

function isRecent(pubdate) {
  const year = parseInt(String(pubdate || "").slice(0, 4), 10);
  return year >= new Date().getFullYear() - 3;
}

async function pickBook(onlyRecent) {
  for (let n = 0; n < MAX_BATCHES; n++) {
    const candidates = [];
    for (let i = 0; i < BATCH_SIZE; i++) candidates.push(randomIsbn13());
    let hits = await lookup(candidates);
    if (onlyRecent) hits = hits.filter(function (h) { return isRecent(h.summary.pubdate); });
    if (hits.length) return hits[Math.floor(Math.random() * hits.length)].summary;
  }
  return null;
}

function amazonUrl(isbn13) {
  return "https://www.amazon.co.jp/dp/" + isbn13to10(isbn13) + "?tag=" + encodeURIComponent(TRACKING_ID);
}

function render(book) {
  const wrap = document.createElement("article");
  wrap.className = "book";

  if (book.cover) {
    const img = document.createElement("img");
    img.className = "cover";
    img.src = book.cover;
    img.alt = book.title + "の表紙";
    img.loading = "lazy";
    wrap.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "nocover";
    ph.textContent = "表紙画像なし";
    wrap.appendChild(ph);
  }

  const info = document.createElement("div");
  const title = document.createElement("h2");
  title.className = "title";
  title.textContent = book.title + (book.volume ? " " + book.volume : "");
  info.appendChild(title);

  [book.author, book.publisher, book.pubdate ? book.pubdate + " 発売" : "", "ISBN " + book.isbn]
    .filter(Boolean)
    .forEach(function (text) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = text;
      info.appendChild(p);
    });

  const a = document.createElement("a");
  a.className = "amz";
  a.href = amazonUrl(book.isbn);
  a.target = "_blank";
  a.rel = "noopener noreferrer sponsored";
  a.textContent = "Amazon.co.jpで見る";
  info.appendChild(a);

  wrap.appendChild(info);
  $result.replaceChildren(wrap);
}

function message(text) {
  const p = document.createElement("p");
  p.className = "msg";
  p.textContent = text;
  $result.replaceChildren(p);
}

$draw.addEventListener("click", async function () {
  $draw.disabled = true;
  message("本を探しています…");
  try {
    const book = await pickBook($recent.checked);
    if (book) render(book);
    else message("見つかりませんでした。もう一度ひいてください。");
  } catch (e) {
    message("本の情報を取得できませんでした。通信状況を確認して、もう一度お試しください。");
  } finally {
    $draw.disabled = false;
  }
});
</script>
</body>
</html>
